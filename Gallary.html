    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Roboto, Arial;
            background-color: #343333;
        }


        /* NAV BAR CODE */

        .nav-item {
            text-decoration: none;
            font-size: 20px;
            font-weight: 800;
            color: azure;
        }

        .nav {
            margin: 10px 20px;
            background-color: #343333;

            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            border-bottom: 2px solid #e9e5e5;
            padding-bottom: 15px;

        }

        nav img {
            border-radius: 50%;
            width: 80px;
        }

        /* GALLARY CODE */

        #gallary {
            margin-top: 10px;
            margin-bottom: 50px;
            padding-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;

            flex-wrap: wrap;

            border: 5px solid rgb(53, 17, 17);
            border-radius: 20px;
            padding-top: 20px;
        }

        .pics-gallary {
            width: 200px;

            animation: appear linear;
            animation-timeline: view();
            animation-range: entry 0% cover 40%;

        }

        .pics-gallary img {
            width: 100%;
            border: 2px solid rgb(0, 0, 0);
            border-radius: 50px;

            transition: transform 0.4s ease;
        }

        .pics-gallary img:hover {
            transform: scale(1.05);
            border: 2.5px solid rgb(255, 255, 255);
        }

        /* GALLARY KEYFRAMES */

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateX(-100px);
                scale: 0.5;
            }

            to {
                opacity: 1;
                transform: translateX(0);
                scale: 1;

            }
        }

        /* WELCOME TEXT CODE */

        .g-text {
            font-size: 20px;
            color: whitesmoke;
            font-weight: 600;
        }

        .welcome-text {
            margin: 0 50px 0 50px;
            line-height: 30px;
            word-spacing: 5px;
        }

        .welcome-text span b {
            color: #ff0000d2;
            font-weight: bolder;
            font-size: 25px;
            letter-spacing: 2px;
        }



        /* FOOTER SECTION CODE*/

        footer {
            background-color: whitesmoke;
            color: black;
            font-size: 15px;
            font-weight: 600;
            padding: 20px;
            text-align: center;
        }

        footer a {
            text-decoration: none;
            background-color: whitesmoke;
        }

        footer b {
            background-color: whitesmoke;
            font-size: 20px;
        }







        /* =========================
   GALLERY MOBILE 2 COLUMNS
========================= */

#gallary {
    width: 100%;
    box-sizing: border-box;
}

@media (max-width: 480px) {

    #gallary {
        gap: 100px;
        padding: 15px 8px;
        box-sizing: border-box;
    }

    .pics-gallary {
        width: calc(50% - 8px);
        max-width: 170px;
    }

    .pics-gallary img {
        width: 100%;
        height: auto;
        display: block;
    }
}

@media (max-width: 380px) {

        gap: 10px;
        padding: 12px 6px;
    }

    .pics-gallary {
        width: calc(50% - 6px);
        max-width: 145px;
    }
}
